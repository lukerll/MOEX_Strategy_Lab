[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-strategy-agent"
version = "1.0.0"
description = "ИИ-агент для формализации и бэктестинга торговых стратегий на данных Московской биржи"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pandas>=2.1",
    "numpy>=1.26",
    "backtesting>=0.6.4",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyarrow>=15",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="900" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="1010" rx="16" fill="#FFFFFF"/>
<rect x="70" y="40" width="470" height="82" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="305.0" y="76.4" text-anchor="middle" font-size="20" font-weight="600" fill="#3D3D3A">1. Вы пишете запрос</text>
<text x="305.0" y="98.4" text-anchor="middle" font-size="15" fill="#5F5E5A">Браузер, ui/web</text>
<rect x="70" y="154" width="470" height="82" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="305.0" y="190.4" text-anchor="middle" font-size="20" font-weight="600" fill="#085041">2. Охрана входа</text>
<text x="305.0" y="212.4" text-anchor="middle" font-size="15" fill="#0F6E56">Торговля, инъекции, границы</text>
<rect x="70" y="268" width="470" height="82" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="305.0" y="304.4" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">3. Понимание</text>
<text x="305.0" y="326.4" text-anchor="middle" font-size="15" fill="#534AB7">GigaChat пишет правила, код проверяет</text>
<rect x="70" y="382" width="470" height="82" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="305.0" y="418.4" text-anchor="middle" font-size="20" font-weight="600" fill="#085041">4. Котировки</text>
<text x="305.0" y="440.4" text-anchor="middle" font-size="15" fill="#0F6E56">MOEX ISS или кеш</text>
<rect x="70" y="496" width="470" height="82" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="305.0" y="532.4" text-anchor="middle" font-size="20" font-weight="600" fill="#085041">5. Бэктест</text>
<text x="305.0" y="554.4" text-anchor="middle" font-size="15" fill="#0F6E56">Два движка и сверка</text>
<rect x="70" y="610" width="470" height="82" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="305.0" y="646.4" text-anchor="middle" font-size="20" font-weight="600" fill="#085041">6. Новости</text>
<text x="305.0" y="668.4" text-anchor="middle" font-size="15" fill="#0F6E56">Совпадение по датам, фильтр</text>
<rect x="70" y="724" width="470" height="82" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="305.0" y="760.4" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">7. Объяснение</text>
<text x="305.0" y="782.4" text-anchor="middle" font-size="15" fill="#534AB7">GigaChat пишет, код сверяет числа</text>
<rect x="70" y="838" width="470" height="82" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="305.0" y="874.4" text-anchor="middle" font-size="20" font-weight="600" fill="#3D3D3A">8. Ответ и отчёт</text>
<text x="305.0" y="896.4" text-anchor="middle" font-size="15" fill="#5F5E5A">Сохраняется в SQLite</text>
